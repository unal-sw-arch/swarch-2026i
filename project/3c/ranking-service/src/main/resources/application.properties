# Server
server.port=${SERVER_PORT:6001}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=2000ms
spring.data.redis.timeout=2000ms

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Ranking Service Config
ranking.redis.ttl-hours=24
ranking.default-limit=10
ranking.max-limit=50

# Active Redundancy (Hot Spare) — fanout exchange + per-instance queue.
# Both instances bind their own queue to the same fanout exchange, so each
# receives every price event and keeps a fully synchronized leaderboard.
# RANKING_INSTANCE_ID / RANKING_INSTANCE_QUEUE differ per instance (active|spare).
ranking.exchange.name=${RANKING_EXCHANGE:ranking_prices_exchange}
ranking.instance.id=${RANKING_INSTANCE_ID:standalone}
ranking.instance.queue=${RANKING_INSTANCE_QUEUE:ranking_prices_standalone}

# Logging
logging.level.com.gameseeker.ranking=INFO
logging.level.org.springframework.amqp=WARN
logging.level.org.springframework.data.redis=WARN

# Swagger
springdoc.api-docs.path=/docs
springdoc.swagger-ui.path=/ui
