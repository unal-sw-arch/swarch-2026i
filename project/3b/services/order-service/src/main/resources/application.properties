# ============================================================
# Servidor
# ============================================================
server.port=${SERVER_PORT:8080}

# ============================================================
# Base de datos
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orderdb}
spring.datasource.username=${DB_USERNAME:orderuser}
spring.datasource.password=${DB_PASSWORD:orderpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

# ============================================================
# Inicialización SQL (schema.sql + data.sql)
# ============================================================
spring.sql.init.mode=${SQL_INIT_MODE:never}

# ============================================================
# RabbitMQ — Event Broker
# ============================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# Exchange y routing keys — configurables por entorno
app.rabbitmq.exchange=${RABBITMQ_EXCHANGE:order.exchange}
app.rabbitmq.routing-key.order-created=${RABBITMQ_RK_ORDER_CREATED:order.created}
app.rabbitmq.routing-key.order-status-changed=${RABBITMQ_RK_ORDER_STATUS_CHANGED:order.status.changed}

# ============================================================
# Catalog Service — cliente HTTP interno
# SUPUESTO DE INTEGRACIÓN: endpoint GET /internal/menu-items/{id}
# ============================================================
catalog.service.url=${CATALOG_SERVICE_URL:http://localhost:3000}

# ============================================================
# Jackson
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=false

# ============================================================
# CORS
# ============================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ============================================================
# Logging
# ============================================================
logging.level.com.restaurant.orderservice=${LOG_LEVEL:INFO}
