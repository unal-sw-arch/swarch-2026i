version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: planio_postgres
    environment:
      POSTGRES_USER: planio_user
      POSTGRES_PASSWORD: planio_pass
      POSTGRES_DB: activity_db
    volumes:
      - ./database/DBpostgre/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planio_user -d activity_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - planio_network

  mongo:
    image: mongo:7
    container_name: planio_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: planio_user
      MONGO_INITDB_ROOT_PASSWORD: planio_pass
      MONGO_INITDB_DATABASE: personalization_db
    volumes:
      - ./database/DBmongo/init/init.js:/docker-entrypoint-initdb.d/init.js
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - planio_network

volumes:
  postgres_data:
  mongo_data:

networks:
  planio_network:
    driver: bridge