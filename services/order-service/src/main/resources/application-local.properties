# ============================================================
# Perfil LOCAL — H2 en memoria, sin Docker, sin Neon
# Usar: mvn spring-boot:run -Dspring-boot.run.profiles=local
# ============================================================

# H2 en modo compatibilidad PostgreSQL
spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA — H2 dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Inicializar schema.sql en cada arranque, data.sql vacío — se desactiva
spring.sql.init.mode=always
spring.sql.init.data-locations=

# Consola H2 disponible en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Deshabilitar auto-configuración de RabbitMQ para no necesitar broker
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# Logging verbose para desarrollo
logging.level.com.restaurant.orderservice=DEBUG
logging.level.org.springframework.web=DEBUG
