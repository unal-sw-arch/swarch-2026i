[project]
name = "ecommerce-backend"
version = "0.1.0"
description = "E-commerce B2C Colombia — Backend API"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Validación y settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Base de datos
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",          # Driver async para PostgreSQL
    "alembic>=1.13.0",

    # Cache
    "redis>=5.0.0",

    # Autenticación
    "python-jose[cryptography]>=3.3.0",   # JWT
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.9",             # Form data

    # IA
    "google-generativeai>=0.7.0",          # Gemini API

    # Pagos
    "httpx>=0.27.0",                       # Cliente HTTP async (Wompi, Resend)

    # Emails
    "resend>=2.0.0",

    # Utilidades
    "python-slugify>=8.0.0",
    "pillow>=10.3.0",                      # Compresión de imágenes
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pylint>=3.2.0",
    "black>=24.0.0",
    "factory-boy>=3.3.0",
]

ai = [
    "google-generativeai>=0.7.0",          # Gemini API (Fase 7)
]

storage = [
    "supabase>=2.5.0",                     # Storage + DB (Fase 4 en adelante)
]

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "migrations"


[tool.pylint.messages_control]
disable = [
    "too-few-public-methods",      # Value Objects y entidades simples
]

[tool.pylint.format]
max-line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# TODO (Phase 3): Re-enable coverage threshold flag `--cov-fail-under=80`
# to comply with RNF-MANT-002 (≥80% coverage on domain & use case layers).
# Currently disabled to avoid blocking the placeholder-test phase.
addopts = "--cov=src --cov-report=term-missing"
