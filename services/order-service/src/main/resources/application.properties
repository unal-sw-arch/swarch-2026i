# ============================================================
# Servidor
# ============================================================
server.port=${SERVER_PORT:8080}

# ============================================================
# Base de datos
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orderdb}
spring.datasource.username=${DB_USERNAME:orderuser}
spring.datasource.password=${DB_PASSWORD:orderpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
# "none" — el schema lo maneja schema.sql, no Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Garantiza que data.sql se ejecute después de que JPA esté inicializado
spring.jpa.defer-datasource-initialization=true

# ============================================================
# Inicialización SQL (schema.sql + data.sql)
# ============================================================
# "always" en local para crear schema y seed; "never" en producción salvo que se defina
spring.sql.init.mode=${SQL_INIT_MODE:never}

# ============================================================
# Integración: tracking-service
# ============================================================
tracking.service.url=${TRACKING_SERVICE_URL:http://localhost:8081}

# ============================================================
# Jackson
# ============================================================
# LocalDateTime se serializa como ISO-8601 string, no como array ni timestamp
spring.jackson.serialization.write-dates-as-timestamps=false

# ============================================================
# CORS
# ============================================================
# En producción reemplazar con el origen exacto del frontend
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ============================================================
# Logging
# ============================================================
logging.level.com.restaurant.orderservice=${LOG_LEVEL:INFO}
