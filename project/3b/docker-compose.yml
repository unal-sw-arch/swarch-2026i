services:
  # E0. Edge — Secure Channel (TLS terminator) + reverse proxy hacia el gateway
  nginx-tls:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./infrastructure/edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/edge/certs:/etc/nginx/certs:ro
    depends_on:
      - api-gateway
    networks:
      - edge-net

  # P1. Customer App (Next.js SSR)
  customer-app:
    build:
      context: ./apps/customer-app
    ports:
      - "3001:3001"
    environment:
      - GATEWAY_BASE_URL=http://api-gateway:4000
    depends_on:
      - api-gateway
    networks:
      - edge-net

  # P2. Restaurant Dashboard operativo (React + Vite)
  restaurant-dashboard:
    build:
      context: ./apps/restaurant-dashboard-prototype2
    ports:
      - "5173:5173"
    environment:
      - VITE_DATA_SOURCE=api
      - VITE_API_BASE_URL=http://localhost:4000
    depends_on:
      - api-gateway
    networks:
      - edge-net

  # L1. API Gateway (Reverse Proxy) — único punto de entrada a la red interna
  api-gateway:
    build:
      context: ./apps/api-gateway
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - LOG_LEVEL=info
      - BODY_LIMIT=1mb
      - HTTP_TIMEOUT_MS=10000
      - AUTH_SERVICE_URL=http://auth-service:8000
      - CATALOG_SERVICE_URL=http://catalog-service:3000
      - ORDER_SERVICE_URL=http://order-service:8080
      - KITCHEN_SERVICE_URL=http://kitchen-service:8082
      - TIMELINE_SERVICE_URL=http://notification-service:8000
      - PROMOTIONS_SERVICE_URL=http://notification-service:8000
      - CACHE_ENABLED=false
      - REDIS_URL=redis://valkey-cache:6379
      - CACHE_TTL_RESTAURANTS=60
      - CACHE_TTL_MENU=60
      - CACHE_TTL_PROMOTIONS=60
      - USE_MOCK_SERVICES=false
      # WAF (Web Application Firewall)
      - WAF_ENABLED=true
      - WAF_MODE=block
      - WAF_MAX_BODY_BYTES=1048576
      # Throttling / Rate Limiting (per-IP, Redis-backed)
      - THROTTLE_ENABLED=true
      - THROTTLE_LIMIT=100
      - THROTTLE_WINDOW_SECONDS=60
      # Resilience (Retry + Circuit Breaker)
      - RESILIENCE_ENABLED=true
      - RETRY_MAX_ATTEMPTS=2
      - RETRY_BASE_DELAY_MS=100
      - BREAKER_FAILURE_THRESHOLD=5
      - BREAKER_RESET_TIMEOUT_MS=10000
    depends_on:
      - auth-service
      - catalog-service
      - order-service
      - kitchen-service
      - notification-service
      - valkey-cache
    networks:
      - edge-net
      - backend-net

  # L2. Auth Service
  auth-service:
    build:
      context: ./services/auth-service
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@auth-db:5432/auth_db
      - JWT_SECRET_KEY=super-secret-key-for-development
    depends_on:
      - auth-db
    networks:
      - backend-net
      - data-net

  # D1. Auth DB
  auth-db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=auth_db
    volumes:
      - auth-data:/var/lib/postgresql/data
      - ./infrastructure/databases/auth-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - data-net

  # L3. Catalog Service
  catalog-service:
    build:
      context: ./services/catalog-service
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@catalog-db:5432/catalog_db?schema=public
      - REDIS_URL=redis://valkey-cache:6379
      - AMQP_URL=amqp://guest:guest@event-broker:5672
      - PORT=3000
    depends_on:
      - catalog-db
      - valkey-cache
      - event-broker
    networks:
      - backend-net
      - data-net

  # D2. Catalog DB
  catalog-db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=catalog_db
    volumes:
      - catalog-data:/var/lib/postgresql/data
    networks:
      - data-net

  # L4. Order Service
  order-service:
    build:
      context: ./services/order-service
    environment:
      - SERVER_PORT=8080
      - DB_URL=jdbc:postgresql://order-db:5432/order_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - JPA_DDL_AUTO=update
      - JPA_SHOW_SQL=false
      - SQL_INIT_MODE=never
      - CATALOG_SERVICE_URL=http://catalog-service:3000
      - TRACKING_SERVICE_URL=http://notification-service:8000
      - RABBITMQ_HOST=event-broker
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - RABBITMQ_EXCHANGE=deliunal.events
      - LOG_LEVEL=INFO
    depends_on:
      - order-db
      - catalog-service
      - event-broker
    networks:
      - backend-net
      - data-net

  # D3. Order DB
  order-db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=order_db
    volumes:
      - order-data:/var/lib/postgresql/data
    networks:
      - data-net

  # L5. Kitchen Service
  kitchen-service:
    build:
      context: ./services/kitchen-service
    environment:
      - PORT=8082
      - AMQP_URL=amqp://guest:guest@event-broker:5672
      - JWT_SECRET=super-secret-key-for-development
    depends_on:
      event-broker:
        condition: service_healthy
    networks:
      - backend-net

  # L6. Notification / Tracking Service
  notification-service:
    build:
      context: ./services/notification-service
    environment:
      - MONGO_URI=mongodb://tracking_service_user:tracking_password_2026@mongo-db:27017/tracking_context?authSource=tracking_context
      - MONGO_DB_NAME=tracking_context
      - MONGO_COLLECTION_NAME=activity_events
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USE_TLS=True
      - SMTP_USER=notificacionesdeliunal@gmail.com
      - SMTP_PASSWORD=cogaiyemehwyzldx
      - DEFAULT_FROM_EMAIL=notificacionesdeliunal@gmail.com
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - mongo-db
    networks:
      - integration-net
      - backend-net
      - data-net

  # D4. Tracking DB
  mongo-db:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
      - ./infrastructure/databases/tracking-db/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - data-net

  # A1. Event Broker
  event-broker:
    image: rabbitmq:3-management
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_ERLANG_COOKIE=deliunalsecretcookie
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend-net

  # D5. Cache (Valkey)
  valkey-cache:
    image: valkey/valkey:7.2
    networks:
      - backend-net

# Network Segmentation Pattern:
#   - edge-net   : capa expuesta al host (borde TLS, frontends, gateway).
#   - backend-net: gateway + microservicios + broker + cache (sin acceso externo).
#   - data-net   : microservicios + sus bases de datos (sin acceso externo).
networks:
  edge-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true
  data-net:
    driver: bridge
    internal: true
  integration-net:
    driver: bridge

volumes:
  mongo-data:
  auth-data:
  catalog-data:
  order-data:
