services:
  # P1. Customer App (Next.js SSR)
  customer-app:
    build:
      context: ./apps/customer-app
    ports:
      - "3001:3001"
    environment:
      - GATEWAY_BASE_URL=http://api-gateway:4000
    depends_on:
      - api-gateway
    networks:
      - deliunal-network

  # P2. Restaurant Dashboard según la Biblia Técnica
  restaurant-dashboard:
    build:
      context: ./apps/restaurant-dashboard
      args:
        - VITE_ORDER_SERVICE_URL=http://localhost:8080
        - VITE_TRACKING_SERVICE_URL=http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - order-service
      - notification-service
    networks:
      - deliunal-network

  # L1. API Gateway
  api-gateway:
    build:
      context: ./services/api-gateway
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - AUTH_SERVICE_URL=http://auth-service:8000
      - CATALOG_SERVICE_URL=http://catalog-service:3000
      - ORDER_SERVICE_URL=http://order-service:8080
      - NOTIFICATION_SERVICE_URL=http://notification-service:8000
    depends_on:
      - auth-service
      - catalog-service
      - order-service
      - notification-service
    networks:
      - deliunal-network

  # L4. Order Service
  order-service:
    build:
      context: ./services/order-service
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - DB_URL=jdbc:postgresql://order-db:5432/order_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - JPA_DDL_AUTO=update
      - JPA_SHOW_SQL=false
      - SQL_INIT_MODE=never
      - CATALOG_SERVICE_URL=http://catalog-service:3000
      - TRACKING_SERVICE_URL=http://notification-service:8000 
      - LOG_LEVEL=INFO
    depends_on:
      - order-db
    networks:
      - deliunal-network

  # D3. Order DB
  order-db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=order_db
    ports:
      - "5435:5432"
    volumes:
      - order-data:/var/lib/postgresql/data
    networks:
      - deliunal-network

  # L5. Kitchen Service
  kitchen-service:
    build:
      context: ./services/kitchen-service
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - AMQP_URL=amqp://guest:guest@event-broker:5672
      - JWT_SECRET=super-secret-key-for-development
    depends_on:
      event-broker:
        condition: service_healthy
    networks:
      - deliunal-network

  # L6. Notification Service
  notification-service:
    build:
      context: ./services/notification-service
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://tracking_service_user:tracking_password_2026@mongo-db:27017/tracking_context?authSource=tracking_context
      - MONGO_DB_NAME=tracking_context
      - MONGO_COLLECTION_NAME=activity_events
    depends_on:
      - mongo-db
    networks:
      - deliunal-network

  # D4. Tracking DB
  mongo-db:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
      - ./infrastructure/databases/tracking-db/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - deliunal-network

  # L2. Auth Service
  auth-service:
    build:
      context: ./services/auth-service
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@auth-db:5432/auth_db
      - JWT_SECRET_KEY=super-secret-key-for-development
    depends_on:
      - auth-db
    networks:
      - deliunal-network

  # D1. Auth DB
  auth-db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=auth_db
    ports:
      - "5433:5432"
    volumes:
      - auth-data:/var/lib/postgresql/data
      - ./infrastructure/databases/auth-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - deliunal-network

  # L3. Catalog Service
  catalog-service:
    build:
      context: ./services/catalog-service
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@catalog-db:5432/catalog_db?schema=public
      - REDIS_URL=redis://valkey-cache:6379
      - AMQP_URL=amqp://guest:guest@event-broker:5672
      - PORT=3000
    depends_on:
      - catalog-db
      - valkey-cache
      - event-broker
    networks:
      - deliunal-network

  # D2. Catalog DB
  catalog-db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=catalog_db
    ports:
      - "5434:5432"
    volumes:
      - catalog-data:/var/lib/postgresql/data
    networks:
      - deliunal-network

  # A1. Event Broker (Biblia Pág. 5)
  event-broker:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # Puerto AMQP
      - "15672:15672" # Puerto Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - deliunal-network

  # D5. Cache (Valkey) - Infraestructura compartida Gateway / Catalog
  valkey-cache:
    image: valkey/valkey:7.2
    ports:
      - "6380:6379"
    networks:
      - deliunal-network

networks:
  deliunal-network:
    driver: bridge

volumes:
  mongo-data:
  auth-data:
  catalog-data:
  order-data:
