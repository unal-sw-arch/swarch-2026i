    resolver 127.0.0.11 ipv6=off valid=10s;

    client_max_body_size 10m;

    proxy_connect_timeout 3s;
    proxy_send_timeout    10s;
    proxy_read_timeout    15s;

    access_log /var/log/nginx/access.log gateway;

    # ── CORS ──────────────────────────────────────────────────────────────────
    set $cors_origin "";
    if ($http_origin = "http://localhost:3000")  { set $cors_origin $http_origin; }
    if ($http_origin = "https://localhost:3000") { set $cors_origin $http_origin; }
    if ($http_origin = "http://localhost:3001")  { set $cors_origin $http_origin; }
    if ($http_origin = "https://example.com")    { set $cors_origin $http_origin; }

    add_header Access-Control-Allow-Origin      $cors_origin always;
    add_header Access-Control-Allow-Credentials true         always;
    add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Requested-With" always;
    add_header Access-Control-Max-Age           600          always;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                         always;
    add_header X-Frame-Options         "DENY"                            always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-Request-ID            $req_id                           always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"api-gateway"}';
    }

    # ── Auth service (with cold-spare failover) ────────────────────────────────
    location /auth/ {
        limit_req zone=general burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://auth_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $req_id;
    }

    # ── User service ───────────────────────────────────────────────────────────
    location /users/ {
        limit_req zone=general burst=20 nodelay;
        limit_req_status 429;

        set $upstream_user "user-service";
        proxy_pass         http://$upstream_user:8000;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $req_id;
    }

    # ── Internal-only routes (subnet_b access control) ────────────────────────
    location /internal/ {
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 172.20.0.0/23;
        allow 127.0.0.1;
        deny all;

        set $upstream_user "user-service";
        proxy_pass         http://$upstream_user:8000;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $req_id;
    }

    # ── Product service ────────────────────────────────────────────────────────
    location /products/ {
        limit_req zone=general burst=20 nodelay;
        limit_req_status 429;

        set $upstream_product "product-service";
        proxy_pass         http://$upstream_product:8003;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $req_id;
    }

    # ── Order service ──────────────────────────────────────────────────────────
    location = /orders {
        return 307 /orders/;
    }

    location /orders/ {
        limit_req zone=general burst=10 nodelay;
        limit_req_status 429;

        set $upstream_order "order-service";
        rewrite            ^/orders/(.*)$ /api/v1/orders/$1 break;
        proxy_pass         http://$upstream_order:8004;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $req_id;
    }

    # ── AI service ────────────────────────────────────────────────────────────
    location = /ai {
        return 307 /ai/;
    }

    location /ai/ {
        limit_req        zone=ai_zone burst=5 nodelay;
        limit_req_status 429;

        set $upstream_ai "ai-service";
        proxy_read_timeout 60s;
        rewrite            ^/ai/(.*)$ /api/v1/$1 break;
        proxy_pass         http://$upstream_ai:8005;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $req_id;
    }

    # ── API docs (with cold-spare failover) ───────────────────────────────────
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass         http://auth_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $req_id;
    }

    location / {
        default_type application/json;
        return 404 '{"detail":"Route not mapped in api-gateway"}';
    }
