apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: deliunal
  labels:
    app: api-gateway
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: deliunal-platform
    app.kubernetes.io/component: gateway
    architecture-pattern: active-redundancy
    redundancy-mode: hot-spare
  annotations:
    deliunal.unal.edu.co/architecture-pattern: "Active Redundancy"
    deliunal.unal.edu.co/redundancy-mode: "Hot Spare"
    deliunal.unal.edu.co/redundancy-description: "Balances traffic across all ready API Gateway replicas."
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      nodePort: 30080
