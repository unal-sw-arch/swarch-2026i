services:
  # P2. Restaurant Dashboard según la Biblia Técnica
  restaurant-dashboard:
    build:
      context: ./apps/restaurant-dashboard
      args:
        - VITE_ORDER_SERVICE_URL=http://localhost:8080
        - VITE_TRACKING_SERVICE_URL=http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - notification-service
    networks:
      - deliunal-network

  # L4. Order Service
  order-service:
    build:
      context: ./services/order-service
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - DB_URL=jdbc:postgresql://ep-falling-darkness-add1enig-pooler.c-2.us-east-1.aws.neon.tech/order-service-db?sslmode=require&channelBinding=require
      - DB_USERNAME=neondb_owner
      - DB_PASSWORD=npg_PwcpikZ64rWn
      - JPA_DDL_AUTO=none
      - JPA_SHOW_SQL=false
      - SQL_INIT_MODE=always
      - TRACKING_SERVICE_URL=http://notification-service:8000 
      - LOG_LEVEL=INFO
    networks:
      - deliunal-network

  # L6. Notification Service
  notification-service:
    build:
      context: ./services/notification-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongo-db
    networks:
      - deliunal-network

  # D4. Tracking DB
  mongo-db:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
      - ./infrastructure/databases/tracking-db/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - deliunal-network

  # L2. Auth Service
  auth-service:
    build:
      context: ./services/auth-service
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@auth-db:5432/auth_db
      - JWT_SECRET_KEY=super-secret-key-for-development
    depends_on:
      - auth-db
    networks:
      - deliunal-network

  # D1. Auth DB
  auth-db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=auth_db
    ports:
      - "5433:5432"
    volumes:
      - auth-data:/var/lib/postgresql/data
      - ./infrastructure/databases/auth-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - deliunal-network

  # L3. Catalog Service
  catalog-service:
    build:
      context: ./services/catalog-service
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@catalog-db:5432/catalog_db?schema=public
      - REDIS_URL=redis://valkey-cache:6379
      - PORT=3000
    depends_on:
      - catalog-db
      - valkey-cache
    networks:
      - deliunal-network

  # D2. Catalog DB
  catalog-db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=catalog_db
    ports:
      - "5434:5432"
    volumes:
      - catalog-data:/var/lib/postgresql/data
    networks:
      - deliunal-network

  # D5. Cache (Valkey) - Infraestructura compartida Gateway / Catalog
  valkey-cache:
    image: valkey/valkey:7.2
    ports:
      - "6380:6379"
    networks:
      - deliunal-network

networks:
  deliunal-network:
    driver: bridge

volumes:
  mongo-data:
  auth-data:
  catalog-data:
