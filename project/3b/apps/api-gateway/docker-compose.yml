services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BODY_LIMIT: ${BODY_LIMIT:-1mb}
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-10000}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://host.docker.internal:3001}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://host.docker.internal:3002}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL:-http://host.docker.internal:3003}
      KITCHEN_SERVICE_URL: ${KITCHEN_SERVICE_URL:-http://host.docker.internal:3004}
      TIMELINE_SERVICE_URL: ${TIMELINE_SERVICE_URL:-http://host.docker.internal:3005}
      PROMOTIONS_SERVICE_URL: ${PROMOTIONS_SERVICE_URL:-http://host.docker.internal:3006}
      CACHE_ENABLED: ${CACHE_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CACHE_TTL_RESTAURANTS: ${CACHE_TTL_RESTAURANTS:-60}
      CACHE_TTL_MENU: ${CACHE_TTL_MENU:-60}
      CACHE_TTL_PROMOTIONS: ${CACHE_TTL_PROMOTIONS:-60}
      USE_MOCK_SERVICES: ${USE_MOCK_SERVICES:-false}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7-alpine
    container_name: api-gateway-redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
