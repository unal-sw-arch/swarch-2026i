# Secure Channel Pattern — TLS terminator delante del API Gateway.
# El tráfico cliente -> borde viaja cifrado (HTTPS). HTTP redirige a HTTPS.

events {}

http {
  # Redirección HTTP -> HTTPS
  server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
  }

  # Terminación TLS y reverse proxy hacia el gateway (red interna)
  server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/deliunal.crt;
    ssl_certificate_key /etc/nginx/certs/deliunal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://api-gateway:4000;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
