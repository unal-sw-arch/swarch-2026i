# ─── Rate Limiting Zones ──────────────────────────────────────────────────────
# General zone: 10 req/s per IP for all routes
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
# AI zone: stricter — 2 req/s per IP (AI calls are expensive)
limit_req_zone $binary_remote_addr zone=ai_zone:10m  rate=2r/s;

# ─── Cold-spare failover upstream (auth) ──────────────────────────────────────
# NGINX OSS resuelve los hostnames de un bloque `upstream` UNA SOLA VEZ al
# cargar la config y cachea la IP para siempre. El `resolver 127.0.0.11` de
# shared.conf NO aplica aquí: solo actúa con `proxy_pass` + variable de NGINX.
#
# Por eso auth-service y auth-service-cold tienen `ipv4_address` FIJA en
# docker-compose.yml (172.20.1.10 y 172.20.1.11). Así el cache siempre es
# válido aunque se reconstruyan los contenedores sin reiniciar el gateway.
#
# ⚠ NO migrar a `proxy_pass http://$var;` con variable: rompería el failover
# nativo de NGINX (backup + max_fails/fail_timeout). La directiva `resolve`
# por-server que resolvería esto existe solo en NGINX Plus (comercial).
upstream auth_backend {
    server ecommerce_auth_service:8001      max_fails=2 fail_timeout=5s;
    server ecommerce_auth_service_cold:8002 backup;
}

# ─── Request ID passthrough ───────────────────────────────────────────────────
map $http_x_request_id $req_id {
    ""      $request_id;
    default $http_x_request_id;
}

log_format gateway '$remote_addr - [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   'rt=$request_time uct=$upstream_connect_time '
                   'urt=$upstream_response_time ust=$upstream_status '
                   'req_id=$req_id ua="$http_user_agent"';

# ─── HTTP server (Reverse Proxy Pattern — dev & evaluation access) ────────────
server {
    listen 8000;
    server_name _;
    include /etc/nginx/api-gateway/shared.conf;
}

# ─── HTTPS server (Secure Channel Pattern + Reverse Proxy Pattern) ────────────
server {
    listen 8443 ssl;
    server_name _;

    # TLS configuration (Secure Channel)
    ssl_certificate     /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/api-gateway/shared.conf;
}
